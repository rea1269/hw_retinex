# general settings
name: FineTune_RetinexFormer_LOL_v2_real
model_type: ImageCleanModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv2/Real_captured/Train/Normal
    dataroot_lq: data/LOLv2/Real_captured/Train/Low
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 12
    batch_size_per_gpu: 32

    ### ------- Training on single fixed-patch size 256x256---------
    mini_batch_sizes: [32]   
    iters: [100000]        # 适配下方总迭代次数
    gt_size: 256   
    gt_sizes: [256]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv2/Real_captured/Test/Normal
    dataroot_lq: data/LOLv2/Real_captured/Test/Low
    io_backend:
      type: disk

# network structures
network_g:
  type: RetinexFormer
  in_channels: 3
  out_channels: 3
  n_feat: 40
  stage: 1
  num_blocks: [1,2,2]

# path
path:
  pretrain_network_g: ~
  strict_load_g: false #lora
  resume_state: ~

# training settings
train:
  total_iter: 20000       # 2万
  warmup_iter: -1          # 微调无需warm up
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [15000]
    restart_weights: [1]
    eta_mins: [0.000002]
  
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: Adam
    lr: !!float 4e-5
    betas: [0.9, 0.999]
  
  # 【多损失函数配置】
  # 1. 主损失：基础像素级 L1 损失，确保整体亮度和色彩的准确恢复
  pixel_opt:
    # type: L1Loss
    # loss_weight: 1
    # reduction: mean
    type: CharbonnierLoss
    loss_weight: 1
    reduction: mean
  # 2. 辅助损失：加入 SSIM 约束，提升局部对比度和去噪后的边缘结构
  ssim_opt:
    type: SSIMLoss
    loss_weight: !!float 0.2   # 保守权重，防止干扰 L1 主导的收敛

# validation settings
val:
  window_size: 4
  val_freq: !!float 1e3
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8

  metrics:
    psnr: 
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 500 # 每500次迭代打印一次日志
  save_checkpoint_freq: !!float 1000 # 每2000次迭代保存一次模型检查点
  use_tb_logger: true 
  wandb:
    project: low_light
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500